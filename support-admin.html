<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support queue · ZC Dorm Laundry</title><script src="auth.js" defer></script><script src="supabase-client.js" defer></script><script src="notifications.js" defer></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f7;color:#172e39;font:14px Arial,sans-serif}header{display:flex;justify-content:space-between;padding:15px 24px;background:white;border-bottom:1px solid #e1e9ea}a{color:#078f9d;text-decoration:none;font-weight:700;font-size:11px;margin-left:12px}main{max-width:1100px;margin:auto;padding:28px 20px}h1{font-size:25px;margin:0 0 7px}.sub{color:#71838a;font-size:12px;margin:0 0 20px}.filters{display:flex;gap:8px;margin-bottom:14px}select,button{padding:9px 12px;border:1px solid #dae6e7;border-radius:8px;background:white;color:#172e39;font-weight:700;font-size:11px;cursor:pointer}.list{display:grid;gap:10px}.item{background:white;border:1px solid #e1e9ea;border-radius:12px;padding:15px;display:grid;grid-template-columns:1fr auto;gap:14px}.item h2{font-size:14px;margin:0 0 7px}.item p{font-size:11px;line-height:1.55;color:#586d74;white-space:pre-wrap}.meta{font-size:10px;color:#74878c}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.primary{background:#078f9d;color:white;border-color:#078f9d}.empty{background:white;padding:18px;border-radius:10px;color:#71838a}@media(max-width:640px){.item{grid-template-columns:1fr}.actions{justify-content:flex-start}}
</style></head><body><header><b>ZC · Dorm Laundry · Support queue</b><nav><a id="overviewLink" href="supervisor.html">Overview</a><a href="approvals.html">Approvals</a><a href="audit.html">Audit log</a><a href="logout.html" data-logout>Log out</a></nav></header><main><h1>Support & complaints</h1><p class="sub">Student support requests in the dorms assigned to your staff role.</p><div class="filters"><select id="statusFilter"><option value="">All requests</option><option value="open">Open</option><option value="in_progress">In progress</option><option value="resolved">Resolved</option><option value="closed">Closed</option></select><button onclick="loadSupportQueue()">Refresh</button></div><section class="list" id="supportQueue"><p class="empty">Loading support requests…</p></section></main><script>
document.addEventListener('DOMContentLoaded',()=>{
  const s=WashdayAuth.currentSession();
  if(s?.role==='admin') document.getElementById('overviewLink').href='admin.html';
  document.getElementById('statusFilter').addEventListener('change', loadSupportQueue);
});
async function loadSupportQueue(){const list=document.getElementById('supportQueue');try{const c=await ZCSupabase.ready(),status=document.getElementById('statusFilter').value;const {data,error}=await c.rpc('staff_list_support_tickets',{p_status:status||null});if(error)throw error;list.replaceChildren();if(!data?.length){list.innerHTML='<p class="empty">No support requests found.</p>';return}data.forEach(t=>{const card=document.createElement('article');card.className='item';const copy=document.createElement('div'),title=document.createElement('h2'),meta=document.createElement('div'),desc=document.createElement('p');title.textContent=t.subject;meta.className='meta';meta.textContent=`${t.student_name} · ${t.student_email} · Dorm ${t.dorm_class} · ${t.category} · ${t.status} · ${new Date(t.created_at).toLocaleString()}`;desc.textContent=t.description;copy.append(title,meta,desc);const actions=document.createElement('div');actions.className='actions';for(const [label,next] of [['Start','in_progress'],['Resolve','resolved'],['Close','closed']]){const b=document.createElement('button');b.className=next==='resolved'?'primary':'';b.textContent=label;b.disabled=t.status===next||t.status==='closed';b.onclick=()=>updateSupport(t.ticket_id,next,b);actions.appendChild(b)}card.append(copy,actions);list.appendChild(card)})}catch(error){list.innerHTML='';const p=document.createElement('p');p.className='empty';p.textContent='Could not load queue: '+(error.message||'Backend not configured');list.append(p)}}
async function updateSupport(id,status,button){let resolution=null;if(status==='resolved'||status==='closed'){resolution=prompt('Add a short response for the student:');if(!resolution||resolution.trim().length<3)return}button.disabled=true;try{const c=await ZCSupabase.ready();const {error}=await c.rpc('staff_update_support_ticket',{p_ticket_id:id,p_status:status,p_resolution:resolution});if(error)throw error;ZCNotify?.success('Support request updated; student notified.');loadSupportQueue()}catch(error){ZCNotify?.error(error.message||'Could not update request.');button.disabled=false}}
document.addEventListener('DOMContentLoaded',loadSupportQueue);
</script></body></html>
